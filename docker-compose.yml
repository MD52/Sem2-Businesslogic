services:

  mysql:
    image: mysql:8.4.4

    container_name: buckingmachine-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: buckingmachine
      MYSQL_USER: user
      MYSQL_PASSWORD: buckingham

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: